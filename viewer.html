<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>교안 불러오는 중</title>
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#1f2328;color:#e9ecef;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding:0 16px}
.box{text-align:center;display:grid;gap:14px;justify-items:center;max-width:420px}
.bar{width:240px;height:6px;border-radius:3px;background:#3a3f46;overflow:hidden}
.bar i{display:block;height:100%;width:8%;background:#6fa8ff;transition:width .2s}
.err{color:#ffb4a9}
</style>
</head>
<body>
<div class="box" role="status" aria-live="polite"><div id="msg">교안을 불러오는 중입니다…</div><div class="bar"><i id="bar"></i></div></div>
<script>
(async function(){
  var msg = document.getElementById('msg'), bar = document.getElementById('bar');
  var id = location.pathname.split('/').filter(Boolean).pop() || '';
  try{
    var r = await fetch('/api/book?id=' + encodeURIComponent(id));
    var j = await r.json();
    if(!r.ok) throw new Error(j.error || '교안을 찾을 수 없습니다.');
    var res = await fetch(j.url);
    if(!res.ok) throw new Error('교안 파일을 받지 못했습니다.');
    var total = +res.headers.get('content-length') || 0, text = '';
    if(res.body && res.body.getReader && total){
      var reader = res.body.getReader(), dec = new TextDecoder('utf-8'), got = 0;
      for(;;){ var s = await reader.read(); if(s.done) break; got += s.value.length; text += dec.decode(s.value, {stream:true}); bar.style.width = Math.min(100, got / total * 100) + '%'; }
      text += dec.decode();
    } else text = await res.text();
    bar.style.width = '100%';
    document.open(); document.write(text); document.close();
  }catch(e){
    msg.className = 'err'; msg.textContent = e.message || '교안을 불러오지 못했습니다.'; bar.parentNode.hidden = true;
  }
})();
</script>
</body>
</html>
